<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - Ticket Details</title>
  <link rel="stylesheet" href="/static/navbar.css" />
  <link rel="stylesheet" href="/static/ticketDetails.css" />
</head>
<body>

  <!-- Navigation Bar -->
 {% include "_navbar.html" %}

  <!-- Main Two-Column Content -->
  <main class="details-container">
    
    <!-- Left Card: Ticket Information -->
    <section class="card details-card">
      <div class="details-header">
        <h2>Ticket Details</h2>
      </div>

      <!-- JS will populate the submitted ticket data here -->
      <div class="details-body" id="ticket-details-content">
        <div class="detail-field">
          <span class="detail-label">Title</span>
          <p class="detail-value" id="ticket-title"></p>
        </div>

        <div class="detail-field">
          <span class="detail-label">Category</span>
          <p class="detail-value" id="ticket-category"></p>
        </div>

        <div class="detail-field">
          <span class="detail-label">Description</span>
          <p class="detail-value" id="ticket-description"></p>
        </div>

        <!-- Image for Maintenance tickets) -->
        <div class="detail-field hidden" id="ticket-image-section">
          <span class="detail-label">Attached Image</span>
          <img id="ticket-image" src="" alt="Ticket attachment" class="ticket-attachment" />
        </div>
      </div>
    </section>

    <!-- Right Card: Chat Panel -->
    <aside class="card chat-card">
      <div class="chat-header" id="chat-header">
        <!-- Optional header space matching layout -->
      </div>

      <!-- JS will append message bubbles here -->
      <div class="chat-messages" id="chat-messages"></div>

      <form class="chat-input-area" id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Send a message..."
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-send" id="btn-send-message" aria-label="Send message">➤</button>
          </svg>
        </button>
      </form>
    </aside>

  </main>

<script src="/static/script.js"></script>
</body>
</html>
