<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - Add Item</title>
  <link rel="stylesheet" href="/static/navbar.css" />
  <link rel="stylesheet" href="/static/add.css" />
</head>
<body>

  <!-- Navigation Bar -->
 <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <main class="page-container">
    <a href="/home" class="back-link">← back</a>

    <section class="card form-card">
      <div class="form-header">
        <h2>Add Item</h2>
      </div>

      <form id="add-item-form">
        <!-- Item Title -->
        <div class="form-group">
          <label for="supply-title">Title</label>
          <input type="text" id="supply-title" name="title" required />
        </div>

        <!-- Assign Tenants (Compact Pill Grid) -->
        <div class="form-group">
          <div class="label-row">
            <label>Assign tenants</label>
            <button type="button" class="text-btn" id="btn-select-all">[Select All]</button>
          </div>
      

          <!-- JS -->
          <div class="tenant-grid" id="tenant-pills-container">
          </div>
          <p class="form-error" id="people-error" hidden>Pick at least one person.</p>
        </div>
        <!-- Bottom Buttons -->
        <div class="form-footer">
          <a href="/home" class="cancel-link">[Cancel]</a>
          <button type="submit" class="btn-submit">[Save]</button>
        </div>
      </form>
    </section>
  </main>


<script src="/static/script.js"></script>
<script src="/static/inventory.js"></script>
</body>
</html>
