<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - New Community Ticket</title>
  <link rel="stylesheet" href="../static/navbar.css" />
  <link rel="stylesheet" href="../static/ticketForm.css"/>
</head>


<body>

  <!-- Navigation Bar -->
 <div id="navbar-placeholder"></div>

  <!-- Ticket Form Container -->
  <main class="ticket-view">
    <div class="ticket-wrapper">
      <a href="myTickets.html" class="btn-back">← back</a>

      <div class="ticket-card">
        <!-- Category Navigation Tabs -->
        <div class="ticket-tabs">
          <a href="ticketForm1.html" class="ticket-tab">[Repair Request]</a>
          <a href="ticketForm2.html" class="ticket-tab active">[Community Complaint]</a>
        </div>

        <!-- Community & House Rules Form -->
        <form class="ticket-form" id="community-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>
          </div>

          <div class="ticket-actions">
            <a href="myTickets.html" class="btn-cancel">[Cancel]</a>
            <button type="submit" class="btn-save">[Save]</button>
          </div>
        </form>
      </div>
    </div>
  </main>


  <script src="../static/script.js"></script>
</body>
</html>
