<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - Add Chore</title>
  <link rel="stylesheet" href="/static/navbar.css" />
  <link rel="stylesheet" href="/static/add.css" /></head>
<body>

  <!-- Navigation Bar -->
 {% include "_navbar.html" %}

  <!-- Main Content -->
  <main class="page-container">
    <a href="/home" class="back-link">← back</a>

    <section class="card form-card">
      <div class="form-header">
        <h2>Add Chore</h2>
      </div>

      <form id="add-chore-form">
        <!-- Chore Title -->
        <div class="form-group">
          <label for="chore-title">Chore Title</label>
          <input type="text" id="chore-title" name="title" required />
        </div>

        <!-- Assigned Tenants (Compact Pill Grid) -->
        <div class="form-group">
          <div class="label-row">
            <label>Who takes turns?</label>
            <button type="button" class="text-btn" id="btn-select-all">[Select All]</button>
          </div>

          <!-- JS will populate tenant pills here -->
                    <div class="tenant-grid" id="tenant-pills-container">
          </div>
          <p class="form-hint">They take turns in this order, one per day it's due.</p>
          <p class="form-error" id="people-error" hidden>Pick at least one person.</p>
        </div>

        <!-- Repeats on (days of the week) -->
        <div class="form-group">
          <div class="label-row">
            <label>Repeats on</label>
            <button type="button" class="text-btn" id="btn-every-day">[Every day]</button>
          </div>
          <div class="tenant-grid" id="weekday-pills">
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="0" /><span>Mo</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="1" /><span>Tu</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="2" /><span>We</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="3" /><span>Th</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="4" /><span>Fr</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="5" /><span>Sa</span></label>
            <label class="tenant-pill"><input type="checkbox" name="weekdays" value="6" /><span>Su</span></label>
          </div>
          <p class="form-error" id="days-error" hidden>Pick at least one day.</p>
        </div>

        <!-- Bottom Buttons -->
        <div class="form-footer">
          <a href="/home" class="cancel-link">[Cancel]</a>
          <button type="submit" class="btn-submit">[Save]</button>
        </div>
      </form>
    </section>
  </main>

 <script src="/static/script.js"></script>
 <script src="/static/chores.js"></script>
</body>
</html>
