<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BV Housing - New Maintenance Ticket</title>
  <link rel="stylesheet" href="/static/ticketForm.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">BV Housing</div>
    </div>
  </header>

  <!-- Ticket Form Container -->
  <main class="ticket-view">
    <div class="ticket-wrapper">
      <a href="/myTickets" class="btn-back">← back</a>

      <div class="ticket-card">
        <!-- Category Navigation Tabs -->
        <div class="ticket-tabs">
          <a href="/repairTicket" class="ticket-tab active">[Repair Request]</a>
          <a href="/communityComplaint" class="ticket-tab">[Community Complaint]</a>
        </div>

        <!-- Maintenance Form -->
        <form class="ticket-form" id="maintenance-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>
          </div>

          <div class="image-upload-group">
            <label for="image" class="import-image-label">📎︎ Import Image</label>
            <input type="file" id="image" name="image" accept="image/*" class="hidden-file-input" />
          </div>

          <div class="ticket-actions">
            <a href="/myTickets" class="btn-cancel">[Cancel]</a>
            <button type="submit" class="btn-save">[Save]</button>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>


</body>
