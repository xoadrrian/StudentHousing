<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - My Tickets</title>
  <link rel="stylesheet" href="../static/myTickets.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">BV Housing</div>
      <nav class="nav-links">
        <a href="schedule.html" class="nav-link">Home</a>
        <a href="myTickets.html" class="nav-link active">My Tickets</a>
      </nav>
    </div>
  </header>

  <!-- Main Reports Content -->
  <main class="reports-container">
    
    <!-- Two-Column Reports Section -->
    <section class="reports-board">
      <div class="reports-headers">
        <div class="category-header">
          <h2>Repair Request</h2>
        </div>
        <div class="category-header">
          <h2>Community Complaints</h2>
        </div>
      </div>

      <div class="reports-columns">
        <div class="report-list" id="maintenance-reports-list">
          <!-- JS will populate Maintenance reports here -->
        </div>
        <div class="report-list" id="community-reports-list">
          <!-- JS will populate Community & House Rules reports here -->
        </div>
      </div>
    </section>

    <!-- Bottom Action Button -->
    <div class="reports-footer">
      <button type="button" class="btn-new-report" id="btn-new-report" onclick="window.location.href='ticketForm1.html'">
  + New report
</button>
    </div>

  </main>

</body>
</html>
