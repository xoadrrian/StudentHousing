<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BV Housing - Manager Ticket Details</title>
  <link rel="stylesheet" href="/static/navbar.css" />
  <link rel="stylesheet" href="/static/managerTicket.css" />
</head>
<body>

  <!-- Manager Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <div class="brand">BV Housing</div>
        <form method="post" action="/logout" class="logout-form">
          <button type="submit" class="nav-logout">Log out</button>
        </form>
      </div>

      <nav class="nav-links">
        <a href="/manager" class="nav-link active">Tickets</a>
      </nav>

      <div class="nav-user">
        <span class="role-badge">{{ user.role or "Manager" }}</span>
        <div class="user-avatar">{{ user.first_name[0] | upper }}</div>
        <span class="user-name">{{ user.first_name }}</span>
      </div>
    </div>
  </header>

  <!-- Main Single-Column Content -->
  <main class="details-container">
    <a href="/manager" class="btn-back">&larr; Back</a>

    <section class="card details-card">
      <div class="details-header">
        <h2>Ticket Details</h2>
      </div>

      <!-- JS ticket data here  -->
      <div class="details-body" id="ticket-details-content">
        <div class="detail-field">
          <span class="detail-label">Title</span>
          <p class="detail-value" id="ticket-title"></p>
        </div>

        <div class="detail-field">
          <span class="detail-label">Category</span>
          <p class="detail-value" id="ticket-category"></p>
        </div>

        <div class="detail-field">
          <span class="detail-label">Description</span>
          <p class="detail-value" id="ticket-description"></p>
        </div>

        <!-- Image for Maintenance tickets -->
        <div class="detail-field hidden" id="ticket-image-section">
          <span class="detail-label">Attached Image</span>
          <img id="ticket-image" src="" alt="Ticket attachment" class="ticket-attachment" />
        </div>

        <!-- Bottom Worker Assignment Section -->
        <div class="assign-section">
          <label for="assigned-worker" class="assign-label">Assigned Technician</label>
          <div class="select-row">
            <select id="assigned-worker" name="worker_id" class="worker-select">
              <option value="" disabled selected>Select a worker...</option>
              <!-- JS or Jinja2 populates workers here -->
            </select>
            <span class="dropdown-triangle">&#9660;</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
